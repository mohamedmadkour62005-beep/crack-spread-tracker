name: Daily data update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python src/crack_spread.py

      - name: Copy chart into docs for GitHub Pages
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          cp output/crack_spread.html docs/index.html

      - name: Commit updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git diff --staged --quiet || git commit -m "Automated daily data refresh"
          git push
